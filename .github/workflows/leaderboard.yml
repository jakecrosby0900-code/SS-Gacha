# Keeps data/leaderboard.json up to date: the read-only leaderboard for visitors who have no token.
# NOTE: this file must sit in the repo's top-level .github/workflows folder. If your site lives in a subfolder of the repo,
# change `working-directory` below to that folder.
name: leaderboard
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: read
concurrency:
  group: leaderboard
  cancel-in-progress: false
defaults:
  run:
    working-directory: .
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-leaderboard.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/leaderboard.json
          git diff --cached --quiet || (git commit -m "Update leaderboard" && git push)
